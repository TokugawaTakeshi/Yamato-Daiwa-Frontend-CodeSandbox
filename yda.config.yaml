$projectBuilding:

  $markupProcessing:

    $common:

      $buildingModeDependent:

        $localDevelopment: { $mustResolveResourcesPointersToRelativePaths: true }


    $linting:

      $linting: { $disable: true }

    $entryPointsGroups:

      Main:

        $singleEntryPointSourceFileRelativePath: src/index.pug

        $HTML_Validation: { $disable: true }
        $accessibilityInspection: { $disable: true }

        $buildingModeDependent:
          $localDevelopment:
            $outputTopDirectoryRelativePath: build

  $stylesProcessing:

    $entryPointsGroups:

      Main:

        $singleEntryPointSourceFileRelativePath: src/index.styl

        $buildingModeDependent:
          $localDevelopment:
            $outputTopDirectoryRelativePath: build

  $ECMA_ScriptLogicProcessing:

    $linting: { $disable: true }

    $entryPointsGroups:

      Main:

        $singleEntryPointSourceFileRelativePath: src/index.ts

        $targetRuntime:
          $type: BROWSER

        $buildingModeDependent:
          $localDevelopment:
            $outputTopDirectoryRelativePath: build

  $browserLiveReloading:

    $setups:

      StaticPreview:

        $localServer:

          $rootDirectoryRelativePath: build

        openInBrowsers: chrome
